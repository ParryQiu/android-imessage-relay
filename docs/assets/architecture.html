<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android iMessage Relay Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      padding: 48px 32px;
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame { width: min(100%, 1280px); }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 24px;
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Secure paved road</p>
    <h1>Android SMS to Apple Messages</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="android-imessage-relay-architecture-title android-imessage-relay-architecture-desc">

      <desc id="android-imessage-relay-architecture-desc">Secure architecture showing encrypted Android SMS delivery through Cloudflare Access and Tunnel to a locally approved Mac relay, Apple Messages, and the Apple recipient, with direct ingress and remote device replacement blocked.</desc>

          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Trust zones are drawn before paths and components. -->
      <rect x="40" y="120" width="240" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>

      <rect x="700" y="120" width="380" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>

      <text x="420" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Dedicated token</text>

      <rect x="520" y="216" width="120" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="528" y="224" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="552" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>

      <text x="980" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Pairing and recovery gate</text>

      <!-- Apple destination remains outside operator-managed infrastructure. -->
